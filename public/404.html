<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#00647c" />
    <title>Página no encontrada | Hacé Números</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color: #0d1c2f;
        background: #f8f9ff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        min-width: 20rem;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(36rem, calc(100% - 2rem));
        box-sizing: border-box;
        padding: 3rem 2rem;
        border: 1px solid #c8d2d7;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 12px 34px rgb(51 65 85 / 12%);
        text-align: center;
      }
      .code {
        margin: 0;
        color: #00647c;
        font-size: 0.875rem;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.1;
      }
      p {
        margin: 1rem auto 0;
        max-width: 28rem;
        color: #46545d;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        min-height: 3rem;
        margin-top: 1.75rem;
        padding: 0 1.5rem;
        align-items: center;
        border-radius: 999px;
        background: #00647c;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: #007f9d;
      }
      a:focus-visible {
        outline: 3px solid #ffb84d;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERROR 404</p>
      <h1>No encontramos esa página</h1>
      <p>Puede que el enlace haya cambiado o todavía no exista.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
