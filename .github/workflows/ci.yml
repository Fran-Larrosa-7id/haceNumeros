name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate committed rent datasets
        run: npm run data:rent:validate

      - name: Run tests
        run: npm test

      - name: Build and prerender production site
        run: npm run build

      - name: Validate static artifact
        run: npm run validate:dist
