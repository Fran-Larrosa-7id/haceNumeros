<header class="sticky top-0 z-50 border-b border-border/60 bg-white/95 backdrop-blur-md">
  <nav
    class="mx-auto flex min-h-18 max-w-site items-center justify-between gap-6 px-4 sm:px-6 lg:px-8"
    aria-label="Navegación principal"
  >
    <a
      routerLink="/"
      class="font-display text-xl font-extrabold tracking-tight text-primary focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
      (click)="closeMenu()"
    >
      Hacé Números
    </a>

    <div class="hidden items-center gap-5 lg:flex">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="['/']"
          [fragment]="item.fragment"
          class="rounded-md px-1 py-2 text-sm font-semibold text-muted transition-colors hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          {{ item.label }}
        </a>
      }
    </div>

    <div class="flex items-center gap-1">
      <button
        type="button"
        data-theme-toggle
        class="flex size-11 items-center justify-center rounded-full text-primary transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
        [attr.title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'"
        [attr.aria-pressed]="theme.isDark()"
        (click)="toggleTheme()"
      >
        <app-icon [name]="theme.isDark() ? 'sun' : 'moon'" />
      </button>

      <button
        type="button"
        class="flex size-11 items-center justify-center rounded-full text-primary transition-colors hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary lg:hidden"
        aria-label="Abrir menú de navegación"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-navigation"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'x' : 'menu'" />
      </button>
    </div>
  </nav>

  @if (menuOpen()) {
    <nav
      id="mobile-navigation"
      class="border-t border-border/60 bg-white px-4 py-3 lg:hidden"
      aria-label="Navegación móvil"
    >
      <div class="mx-auto flex max-w-site flex-col">
        @for (item of navItems; track item.label) {
          <a
            [routerLink]="['/']"
            [fragment]="item.fragment"
            class="flex min-h-11 items-center rounded-lg px-3 font-semibold text-muted hover:bg-surface-muted hover:text-primary focus-visible:outline-2 focus-visible:outline-primary"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
      </div>
    </nav>
  }
</header>
